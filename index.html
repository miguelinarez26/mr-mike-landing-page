        // 1. Framework & Router Setup
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Context & State Management ---
        const CartContext = React.createContext();

        const CartProvider = ({ children }) => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);

            // Updated addToCart to handle items with price overrides or additions
            const addToCart = (item, option = null, priceOverride = null) => {
                let finalPrice = item.price;
                if (priceOverride) {
                    finalPrice = priceOverride;
                }

                const existingItemIndex = cart.findIndex(i => i.name === item.name && i.option === option);

                if (existingItemIndex > -1) {
                    // Increment quantity if same item+option exists
                    const newCart = [...cart];
                    newCart[existingItemIndex].quantity += 1;
                    setCart(newCart);
                } else {
                    const newItem = {
                        ...item,
                        option,
                        price: finalPrice,
                        quantity: 1,
                        id: Date.now()
                    };
                    setCart([...cart, newItem]);
                }
            };

            const removeFromCart = (itemId) => {
                setCart(cart.filter(item => item.id !== itemId));
            };

            const updateQuantity = (itemId, change) => {
                setCart(cart.map(item => {
                    if (item.id === itemId) {
                        const newQuantity = Math.max(0, item.quantity + change);
                        return { ...item, quantity: newQuantity };
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const cartTotal = cart.reduce((total, item) => {
                const price = typeof item.price === 'string' ? parseFloat(item.price.replace('$', '')) : item.price;
                return total + (price * item.quantity);
            }, 0);

            const cartCount = cart.reduce((acc, item) => acc + item.quantity, 0);

            return (
                <CartContext.Provider value={{ cart, addToCart, removeFromCart, updateQuantity, cartTotal, cartCount, isCartOpen, setIsCartOpen }}>
                    {children}
                </CartContext.Provider>
            );
        };

        // --- Shared Components ---

        // Option Selection Modal
        const OptionModal = ({ isOpen, onClose, onConfirm, item }) => {
            const [selectedOption, setSelectedOption] = useState(null);

            useEffect(() => {
                if (isOpen && item?.options?.length > 0) {
                    // Default to first option
                    setSelectedOption(item.options[0]);
                }
            }, [isOpen, item]);

            if (!isOpen || !item) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white dark:bg-surface-dark rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all scale-100 p-6 border-2 border-primary">

                        <p className="text-center text-gray-600 dark:text-gray-300 mb-6 font-sans">

                        </p>

                        <div className="space-y-3 mb-8 max-h-60 overflow-y-auto">
                            {item.options.map((opt, idx) => {
                                const isString = typeof opt === 'string';
                                const label = isString ? opt : opt.label;
                                const isSelected = selectedOption === opt || (selectedOption && selectedOption.label === label);

                                return (
                                    <label key={idx} className={`flex items-center justify-between p-3 rounded-xl border-2 cursor-pointer transition-all ${isSelected ? 'border-primary bg-primary/10' : 'border-gray-200 dark:border-gray-700 hover:border-primary/50'}`}>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-gray-800 dark:text-white">{label}</span>
                                            {!isString && opt.price && <span className="text-xs text-primary font-bold">{opt.price}</span>}
                                        </div>
                                        <input
                                            type="radio"
                                            name="option"
                                            checked={isSelected}
                                            onChange={() => setSelectedOption(opt)}
                                            className="form-radio text-primary focus:ring-primary h-5 w-5"
                                        />
                                    </label>
                                );
                            })}

                                Cancel
                            </button>
                            <button
                                onClick={() => onConfirm(selectedOption)}
                                className="flex-1 py-3 px-4 rounded-xl font-bold text-white bg-primary hover:bg-red-700 shadow-lg transform active:scale-95 transition-all"
                            >
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            );

        // Theme Toggle Component
        const ThemeToggle = () => {
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    setIsDark(true);
                }
            }, []);

            const toggleTheme = () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    // localStorage.setItem('theme', 'light'); // Optional persistence
                    setIsDark(false);
                } else {
                    html.classList.add('dark');
                    // localStorage.setItem('theme', 'dark');
                    setIsDark(true);
                }
            };

            return (
                <button
                    onClick={toggleTheme}
                    className="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors focus:outline-none"
                    aria-label="Toggle Dark Mode"
                >
                    <span className="material-icons text-gray-600 dark:text-gray-300">
                        {isDark ? 'light_mode' : 'brightness_4'}
                    </span>
                </button>
            );
        };

                                        <li className="flex justify-between pt-2 mt-2">
                                            <span className="font-bold text-gray-800 dark:text-white">Total</span>
                                            <span className="font-bold text-xl text-primary">${cartTotal.toFixed(2)}</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div className="bg-surface-light dark:bg-surface-dark p-8 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700">
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-display text-primary">Registro de Cliente</h2>
                                    <p className="mt-1 text-sm text-gray-500 dark:text-gray-400">Ingresa tus datos para continuar</p>
                                </div>
                                <form onSubmit={handleSubmit} className="space-y-5">

                                    {/* Delivery Toggle using standard Radio buttons for better compatibility */}
                                    <div className="flex justify-center gap-4 mb-4">
                                        <label className={`cursor-pointer px-4 py-2 rounded-full border-2 transition-all ${deliveryMode === 'pickup' ? 'bg-primary text-white border-primary' : 'border-gray-300 text-gray-500 hover:border-primary'}`}>

                                        </label>
                                        <label className={`cursor-pointer px-4 py-2 rounded-full border-2 transition-all ${deliveryMode === 'delivery' ? 'bg-primary text-white border-primary' : 'border-gray-300 text-gray-500 hover:border-primary'}`}>
                                            <input type="radio" name="deliveryMode" value="delivery" checked={deliveryMode === 'delivery'} onChange={() => setDeliveryMode('delivery')} className="hidden" />
                                            <span className="flex items-center gap-2"><span className="material-icons text-sm">motorcycle</span> Delivery</span>
                                        </label>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" htmlFor="nombre">Nombre</label>
                                            <div className="relative rounded-md shadow-sm">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                    <span className="material-icons text-gray-400 text-lg">person</span>
                                                </div>
                                                <input className="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white py-2.5" id="nombre" name="nombre" placeholder="Ej. Miguel" required type="text" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" htmlFor="apellido">Apellido</label>
                                            <div className="relative rounded-md shadow-sm">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                    <span className="material-icons text-gray-400 text-lg">person_outline</span>
                                                </div>
                                                <input className="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white py-2.5" id="apellido" name="apellido" placeholder="Ej. Pérez" required type="text" />
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" htmlFor="cedula">Cédula</label>
                                        <div className="relative rounded-md shadow-sm">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <span className="material-icons text-gray-400 text-lg">badge</span>
                                            </div>
                                            <input className="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white py-2.5" id="cedula" name="cedula" placeholder="Ej. V-12345678" required type="text" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" htmlFor="email">Correo Electrónico</label>
                                        <div className="relative rounded-md shadow-sm">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <span className="material-icons text-gray-400 text-lg">email</span>
                                            </div>
                                            <input className="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white py-2.5" id="email" name="email" placeholder="Ej. usuario@correo.com" required type="email" />
                                        </div>
                                    </div>

                                    {/* Conditional Address Field */}
                                    {deliveryMode === 'delivery' && (
                                        <div className="animate-fadeIn">
                                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" htmlFor="direccion">Dirección de Entrega</label>
                                            <div className="relative rounded-md shadow-sm">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                    <span className="material-icons text-gray-400 text-lg">location_on</span>
                                                </div>
                                                <textarea className="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-800 dark:text-white py-2.5" id="direccion" name="direccion" placeholder="Ej. Av. Principal, Edif. A, Apto 1" required rows="2"></textarea>
                                            </div>
                                        </div>
                                    )}

                                    {/* File Upload for Payment Proof */}
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Comprobante de Pago</label>
                                        <div className="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-lg hover:border-primary transition-colors cursor-pointer relative bg-gray-50 dark:bg-gray-800">
                                            <div className="space-y-1 text-center">
                                                <span className="material-icons text-gray-400 text-3xl">cloud_upload</span>
                                                <div className="flex text-sm text-gray-600 dark:text-gray-400">
                                                    <label htmlFor="comprobante" className="relative cursor-pointer bg-transparent rounded-md font-medium text-primary hover:text-red-700 focus-within:outline-none">
                                                        <span>Sube un archivo</span>
                                                        <input id="comprobante" name="comprobante" type="file" accept=".jpg,.png,.pdf" className="sr-only" />
                                                    </label>
                                                    <p className="pl-1">o arrastra y suelta</p>
                                                </div>
                                                <p className="text-xs text-gray-500">PNG, JPG, PDF hasta 5MB</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="pt-4">
                                        <button className="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all transform hover:scale-[1.02]" type="submit">
                                            CONTINUAR AL PAGO
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </main>

                    <footer className="bg-surface-light dark:bg-surface-dark border-t border-gray-200 dark:border-gray-700">
                        <div className="checkered-border-bottom"></div>
                        <div className="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                            <div className="mt-4 text-center text-xs text-gray-500 dark:text-gray-500">
                                © 2025 Mr. Mike Burger & Hot Dogs. Todos los derechos reservados.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // --- Screen 3: Cart Page (Modal Style) ---

        const CartPage = () => {
            const navigate = useNavigate();
            const { cart, removeFromCart, updateQuantity, cartTotal, cartCount } = React.useContext(CartContext);

            return (
                <div className="bg-background-light dark:bg-background-dark font-body min-h-screen flex flex-col overflow-hidden transition-colors duration-300 relative">
                    {/* Background Content (blurred and non-interactive simulation) */}
                    <div aria-hidden="true" className="flex-grow flex flex-col h-screen select-none relative pointer-events-none">
                        <nav className="sticky top-0 z-10 bg-primary shadow-lg opacity-80">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    <span className="font-display text-3xl text-white tracking-wider">Mr. Mike</span>
                                </div>
                            </div>
                        </nav>
                        <main className="flex-grow flex items-center justify-center p-8 relative overflow-hidden opacity-50 blur-[2px]">
                            <div className="max-w-4xl text-center z-0">
                                <h1 className="font-display text-7xl text-primary dark:text-red-500 mb-6 rotate-[-2deg]">Best Burgers in Town!</h1>
                            </div>
                        </main>
                    </div>

                    {/* Cart Modal Overlay */}
                    <div aria-modal="true" className="fixed inset-0 z-50 flex justify-end" role="dialog">
                        {/* Backdrop - Click to close */}
                        <div
                            aria-label="Close cart"
                            className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
                            onClick={() => navigate('/')}
                        ></div>

                        {/* Cart Sidebar */}
                        <div className="relative w-full md:w-[600px] h-full bg-paper-light dark:bg-paper-dark shadow-2xl flex flex-col border-l-4 border-primary transform transition-transform duration-300 ease-in-out">
                            {/* Header */}
                            <div className="flex items-center justify-between px-6 py-5 border-b border-primary/10 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md sticky top-0 z-10 shadow-sm">
                                <div className="flex items-center gap-4">
                                    <button
                                        onClick={() => navigate('/')}
                                        className="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 text-text-light dark:text-gray-300 transition-colors group"
                                        title="Cerrar y seguir comprando"
                                    >
                                        <span className="material-symbols-outlined text-2xl group-hover:text-primary dark:group-hover:text-red-400">arrow_back</span>
                                    </button>
                                    <div>
                                        <h2 className="font-display text-3xl text-primary dark:text-red-500 leading-none">Tu Carrito</h2>
                                        <p className="text-xs text-text-light dark:text-gray-400 mt-1">Mr. Mike Online Store</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="bg-primary/10 dark:bg-red-900/20 text-primary dark:text-red-400 text-xs font-bold px-3 py-1.5 rounded-full border border-primary/20">{cartCount} Items</span>
                                    <ThemeToggle />
                                </div>
                            </div>

                            {/* Cart Items */}
                            <div className="flex-1 overflow-y-auto overflow-x-hidden p-6 space-y-8 bg-paper-light dark:bg-paper-dark">
                                {cart.length === 0 ? (
                                    <div className="text-center py-20 opacity-50">
                                        <span className="material-icons text-6xl mb-4">remove_shopping_cart</span>
                                        <p className="text-xl">Tu carrito está vacío</p>
                                        <button onClick={() => navigate('/')} className="mt-4 text-primary font-bold hover:underline">Ir al Menú</button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {cart.map((item) => (
                                            <div key={item.id} className="flex flex-row items-start gap-4 p-4 bg-white dark:bg-zinc-800/50 rounded-xl border border-gray-100 dark:border-zinc-800 shadow-sm hover:shadow-md transition-shadow group">
                                                {/* Use a generic image if none provided in item */}
                                                <img alt={item.name || item.title} className="w-20 h-20 rounded-lg object-cover shadow-sm border border-primary/20" src={item.img || "https://lh3.googleusercontent.com/aida-public/AB6AXuCQV5e85ZtF0Lqq_4n303C4Bv1lCwbwW_Bqj_3S8l6k4lK8qXW31L7tV4l4mK4k_5Y_5pWn8qL8tV9l9lX9j3k3q_5h6n8m7p8q9rs0t1u2v3w4x5y6z7A8B9C0"} />
                                                <div className="flex-grow min-w-0">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <h3 className="font-display text-xl text-primary dark:text-red-400 truncate pr-2">{item.name || item.title}</h3>
                                                        <span className="font-bold text-lg text-primary dark:text-red-400 whitespace-nowrap">{typeof item.price === 'number' ? `$${item.price.toFixed(2)}` : item.price}</span>
                                                    </div>
                                                    <p className="text-xs text-text-light dark:text-text-dark mb-3 truncate">
                                                        {item.option ? <span className="font-bold text-primary">{item.option}</span> : item.desc}
                                                    </p>
                                                    <div className="flex justify-between items-center">
                                                        <div className="inline-flex items-center bg-gray-100 dark:bg-zinc-700 rounded-lg p-0.5 shadow-inner">
                                                            <button onClick={() => updateQuantity(item.id, -1)} className="p-1 hover:bg-white dark:hover:bg-zinc-600 rounded-md text-primary dark:text-red-400 transition-colors shadow-sm"><span className="material-symbols-outlined text-sm font-bold">remove</span></button>
                                                            <span className="px-3 font-bold text-sm text-text-light dark:text-white">{item.quantity}</span>
                                                            <button onClick={() => updateQuantity(item.id, 1)} className="p-1 hover:bg-white dark:hover:bg-zinc-600 rounded-md text-primary dark:text-red-400 transition-colors shadow-sm"><span className="material-symbols-outlined text-sm font-bold">add</span></button>
                                                        </div>
                                                        <button onClick={() => removeFromCart(item.id)} className="text-gray-400 hover:text-red-500 transition-colors"><span className="material-icons text-sm">delete</span></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="pt-6 border-t border-dashed border-gray-300 dark:border-zinc-700 bg-white/50 dark:bg-zinc-900/50 p-6">
                                <div className="flex items-end justify-between mb-6 pb-4">
                                    <span className="font-display text-3xl text-primary dark:text-red-500">Total</span>
                                    <div className="text-right">
                                        <span className="block font-display text-4xl text-primary dark:text-white">${cartTotal.toFixed(2)}</span>
                                        <span className="text-xs text-gray-500 dark:text-gray-500">Incluye IVA</span>
                                    </div>
                                </div>
                                <button
                                    onClick={() => navigate('/register')}
                                    className="w-full bg-primary hover:bg-red-800 text-white font-bold py-4 px-6 rounded-lg shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0 text-lg flex justify-center items-center gap-2 group"

                                    <span>Pagar Ahora</span>
                                    <span className="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>

                            </div>
                        </div>
                    </div>
                </div>

        // --- Main App Component ---

        const App = () => {
            return (
                <CartProvider>
                    <MemoryRouter>
                        <Routes>
                            <Route path="/" element={<HomePage />} />
                            <Route path="/cart" element={<CartPage />} />
                            <Route path="/register" element={<RegistrationPage />} />
                        </Routes>
                        <a
                            href="https://wa.me/584120000000"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="fixed bottom-6 right-6 z-50 transition-transform hover:scale-110 drop-shadow-2xl flex items-center justify-center"
                            aria-label="Contact on WhatsApp"

                            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" className="w-14 h-14 lg:w-16 lg:h-16" />

                    </MemoryRouter>
                </CartProvider>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
